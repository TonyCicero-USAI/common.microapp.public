<div #loaderSpinner id="loaderSpinner" [ngClass]="isResize?'load-resize-spinner':'load-default-spinner'" *ngIf="show">
    <div [ngClass]="isFullPage ? 'container-full' : 'container'">

        <div class="generic-spinner">
            <mat-spinner></mat-spinner>
        </div>
        <div class="text">{{text}}</div>
    </div>
</div>
