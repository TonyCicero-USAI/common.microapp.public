<ng-container>
    <div class="main app-main" [ngClass]="{ 'has-organization-banner': this.isBannerVisible && config.isHeaderVisible }">

        <!-- Organization banner -->
        <div [ngClass]="{ 'banner':this.isBannerVisible, 'banner-hidden':!this.isBannerVisible }" *ngIf="this.isBannerVisible && config.isHeaderVisible" >
            <banner class="w-100">                
            </banner>
        </div>

        <!-- MAIN CONTENT -->
        <div class="d-flex app-main-body">

            <!-- LEFT NAVIGATION -->
            <div [ngClass]="{ 'sidebar':true, 'sidebar-banner':this.isBannerVisible, 'sidebar-secondary':this.isSidebarSecondaryExpanded }" *ngIf="config.isNavigationVisible"> 
                <navigation (onSidebarExpanded)="this.isSidebarExpanded = $event" (onSidebarSecondaryExpanded)="this.isSidebarSecondaryExpanded = $event">
                </navigation>
            </div>

            <div class="app-main-content" [ngClass]="{ 'sidebar-visibility':config.isNavigationVisible, 'has-header':config.isHeaderVisible,'sidebar-expanded': this.isSidebarExpanded && config.isNavigationVisible }" >

                <!-- HEADER - RIGHT TOP MENU -->
                <div class="d-flex justify-content-end w-100" [ngClass]="{ 'header':true, 'header-banner':this.isBannerVisible }" *ngIf="config.isHeaderVisible">
                    <header>                
                    </header>
                </div>   

                <!-- MAIN PAGE -->
                <div class="app-main-content-view content" [ngClass]="{ 
                    'content-sidebar-secondary':this.isSidebarSecondaryExpanded && config.isNavigationVisible, 
                    'sidebar-visibility':config.isNavigationVisible,
                    'sidebar-expanded': this.isSidebarExpanded && config.isNavigationVisible }">
                    <router-outlet #mainOutlet="outlet">                
                    </router-outlet>
                </div>
            </div>
        </div>
    </div>
</ng-container>

<app-error></app-error>
<app-loading-spinner [isFullPage]="true" [isLoading]="!mainOutlet.isActivated"></app-loading-spinner>
